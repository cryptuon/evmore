site_name: EVMORE Documentation
site_description: "EVMORE: Proof-of-work digital gold built on Ethereum with KeccakCollision mining"
site_url: https://docs.cryptuon.com/evmore/
repo_url: https://github.com/cryptuon/evmore
repo_name: cryptuon/evmore
edit_uri: edit/main/documentation/docs/
site_author: Cryptuon Research

theme:
  name: material
  palette:
    - scheme: default
      primary: amber
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: amber
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

docs_dir: docs
site_dir: ../_site

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Docs:
    - Getting Started:
      - What is EVMORE?: getting-started/what-is-evmore.md
      - Quick Start: getting-started/quick-start.md
      - Token Economics: getting-started/economics.md
      - FAQ: getting-started/faq.md
      - Glossary: getting-started/glossary.md
      - Troubleshooting: getting-started/troubleshooting.md
  - Architecture:
    - Overview: architecture/overview.md
    - Staged Deployment: architecture/staged-deployment.md
    - Cross-Chain Bridge: architecture/cross-chain-bridge.md
    - Federated Mining: architecture/federated-mining.md
    - Smart Contracts:
      - Contract Reference: contracts/reference.md
  - Project:
    - Mining:
      - Mining Guide: mining/mining-guide.md
      - KeccakCollision Algorithm: mining/mining-algorithm.md
    - Developers:
      - Getting Started: developers/getting-started.md
      - Contributing: developers/contributing.md
    - Community:
      - Resources: community/resources.md

extra:
  homepage: https://evmore.cryptuon.com/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cryptuon/evmore
    - icon: fontawesome/brands/discord
      link: https://discord.gg/evmore
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/EVMOREGold

copyright: Copyright &copy; 2026 Cryptuon Research
